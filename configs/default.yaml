seed: 42

logging:
    level: INFO

training:
    epochs: 1
    batch_size: 64
    lr: 0.001

paths:
    data: ./data
export:
    pt_path: ./artifacts/tinycnn_cifar10.pt
    onnx_path: ./artifacts/tinycnn_cifar10.onnx

onnx:
    providers:
        - CPUExecutionProvider
    # For CUDA-enabled machines, prefer CUDA with CPU fallback:
    # providers:
    #     - CUDAExecutionProvider
    #     - CPUExecutionProvider

verify:
    tolerance:
        max_abs_diff: 1.0e-4
    output_path: outputs/verify_results.json
    input:
        source: synthetic
        shape: [1, 3, 32, 32]
        fill: zeros

latency:
    warmup_runs: 10
    timed_runs: 100
    output_path: outputs/latency_results.json
    input:
        source: synthetic
        shape: [1, 3, 32, 32]
        fill: zeros
